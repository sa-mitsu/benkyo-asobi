@media(max-height:750px){.qcard{min-height:170px;max-height:255px}.formula{font-size:clamp(55px,13vw,83px)}.option,.option:nth-child(n){width:54px;height:54px;font-size:24px}.option.enter{font-size:16px}.answers{gap:6px}.combo{height:29px}}
@media(prefers-reduced-motion:reduce){body:before,.option:nth-child(n):before{animation:none!important}}
</style></head><body><main class="shell"><header class="top"><div class="brand">💎 DIAMOND MATH <span style="font-size:11px;color:#8e94aa">100</span></div><a class="home" href="/">⌂ トップへ</a></header>
<div class="screen" id="setup"><p class="eyebrow">READY, SET, GO!</p><h1 class="heading">けいさんを、<br>ゲームにしよう。 ✨</h1><p class="intro">くりあがり・くりさがりだけ！<br>1もんずつ、テンポよく！<br>ぜんぶ とくまでの タイムに ちょうせん。</p><div class="panel"><p class="section-title">どんな けいさん？</p><div class="segments" id="modes"><button class="seg selected" data-mode="add">＋<br>たしざん</button><button class="seg" data-mode="sub">−<br>ひきざん</button><button class="seg" data-mode="mix">✦<br>まぜまぜ</button></div><p class="section-title">なんもん チャレンジ？</p><div class="segments" id="counts"><button class="seg" data-count="10">10もん</button><button class="seg" data-count="25">25もん</button><button class="seg selected" data-count="100">100もん</button></div><button class="primary" id="start">チャレンジ スタート →</button></div><p class="subnote">♫ BGM と カタカタ おとで たのしく！</p></div>
<div class="screen hidden" id="play"><div class="gamehead"><div class="pill" id="number">01 / 100</div><div class="pill time" id="clock">⏱ 0:00</div></div><div class="track"><div class="progress" id="progress"></div></div><div class="combo" id="combo"></div><div class="boost-meter" aria-hidden="true"><div class="boost-fill" id="boostFill"></div></div><div class="qcard" id="qcard"><div class="qtag">✧ DIAMOND MATH ✧</div><div class="formula" id="formula">8 ＋ 5 = ?</div><div class="typed" id="typed">_</div></div><div class="answer-label">すうじを おして、OK！ ✨</div><div class="answers" id="answers"></div><div class="sound-controls"><button class="sound-toggle on" id="musicBtn" type="button">♫ BGM ON</button><button class="sound-toggle on" id="sfxBtn" type="button">⌨ おと ON</button></div><div class="feedback" id="feedback" aria-live="polite"></div><p class="smallprint">あわてなくて だいじょうぶ。じぶんの ペースで！</p></div>
<div class="screen done hidden" id="done"><div class="medal">🏆</div><p class="eyebrow" style="margin:0">MISSION COMPLETE!</p><h1 class="heading">ぜんぶ できたね！</h1><div class="finish-time" id="result">0:00</div><div id="detail" style="color:#777e94;font-weight:800"></div><div class="best" id="best"></div><button class="primary again" id="again">もういちど あそぶ ↗</button><button class="ghost" id="back">もどる</button></div></main>
<script>
let mode='add',count=100,problems=[],index=0,started=0,timer=null,locked=false,combo=0,maxCombo=0,miss=0,typed='',audio=null,musicOn=true,sfxOn=true,musicTimer=null,beat=0;
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n);
function select(group,attribute,setter){document.querySelectorAll('#'+group+' button').forEach(b=>b.addEventListener('click',()=>{setter(b.dataset[attribute]);document.querySelectorAll('#'+group+' button').forEach(x=>x.classList.toggle('selected',x===b))}))}
select('modes','mode',v=>mode=v);select('counts','count',v=>count=+v);
function make(){let op=mode==='mix'?(rnd(2)?'add':'sub'):mode,a,b;if(op==='add'){a=2+rnd(8);b=11-a+rnd(a-1)}else{a=11+rnd(8);b=(a-10)+1+rnd(10-(a-10))}return{a,b,op,ans:op==='add'?a+b:a-b}}
function ensureAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}return audio}
function tone(freq,duration=.1,volume=.04,type='sine',when=0){const ctx=ensureAudio();if(!ctx)return;let t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.02)}
function keyClick(){if(!sfxOn)return;const ctx=ensureAudio();if(!ctx)return;const duration=.038,buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*duration),ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++){let x=i/data.length;data[i]=(Math.random()*2-1)*Math.pow(1-x,3)}let source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;filter.type='highpass';filter.frequency.value=950;gain.gain.value=.16;source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start();tone(210,.025,.028,'triangle')}
function ping(){if(!sfxOn)return;const bonus=combo>=20?3:combo>=10?2:combo>=5?1:0;[[0,523],[.07,659],[.14,784],[.22,1047],...[...Array(bonus)].map((_,i)=>[.3+i*.08,1175+i*220])].forEach(([t,n])=>tone(n,.19,.07,'triangle',t))}
const melody=[523,659,784,659,587,698,880,698,659,784,988,784,587,698,784,523];const bass=[262,262,220,220,233,233,196,196];
function musicStep(){if(!musicOn||$('play').classList.contains('hidden'))return;let n=melody[beat%melody.length];tone(n,.16,.022,'sine');if(beat%2===0)tone(bass[Math.floor(beat/2)%bass.length],.22,.025,'triangle');beat++}
function startMusic(){stopMusic();if(!musicOn)return;ensureAudio();musicTimer=setInterval(musicStep,235);musicStep()}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
$('musicBtn').onclick=()=>{musicOn=!musicOn;$('musicBtn').textContent=musicOn?'♫ BGM ON':'♫ BGM OFF';$('musicBtn').classList.toggle('on',musicOn);if(musicOn)startMusic();else stopMusic()};
$('sfxBtn').onclick=()=>{sfxOn=!sfxOn;$('sfxBtn').textContent=sfxOn?'⌨ おと ON':'⌨ おと OFF';$('sfxBtn').classList.toggle('on',sfxOn)};
function fmt(ms){let s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function render(){locked=false;typed='';let p=problems[index];$('number').textContent=String(index+1).padStart(2,'0')+' / '+count;$('progress').style.width=(index/count*100)+'%';$('formula').innerHTML=p.a+' '+(p.op==='add'?'＋':'−')+' '+p.b+' <span class="question-mark">= ?</span>';$('typed').textContent='_';$('feedback').textContent='';$('combo').textContent=combo>=3?(combo>=20?'👑 LEGEND '+combo+' COMBO!':combo>=10?'🚀 ULTRA BOOST '+combo+' COMBO!':combo>=5?'⚡ BOOST '+combo+' COMBO!':'🔥 '+combo+'れんぞく せいかい！'):'';document.body.classList.toggle('hyper',combo>=10);document.body.classList.toggle('charged',combo>=5);$('boostFill').style.width=Math.min(100,combo*5)+'%';$('answers').replaceChildren();[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].forEach(n=>{let b=document.createElement('button');b.className='option'+(n==='⌫'?' action':n==='OK'?' enter':'');b.textContent=n;b.setAttribute('aria-label',n==='⌫'?'ひとつけす':n==='OK'?'こたえあわせ':String(n));b.addEventListener('click',()=>input(n));$('answers').append(b)})}
function input(n){if(locked)return;keyClick();if(n==='⌫'){typed=typed.slice(0,-1)}else if(n==='OK'){check();return}else if(typed.length<2){typed+=String(n)}$('typed').textContent=typed||'_'}
function sparkle(){const amount=combo>=20?52:combo>=10?40:combo>=5?30:18;const card=$('qcard').getBoundingClientRect(),cx=card.left+card.width/2,cy=card.top+card.height/2;const icons=['✨','⭐','💖','🌟','✦','💫'];for(let i=0;i<amount;i++){let e=document.createElement('span');e.className='spark';e.textContent=icons[rnd(icons.length)];e.style.left=cx+(rnd(100)-50)+'px';e.style.top=cy+(rnd(80)-40)+'px';e.style.setProperty('--x',(rnd(380)-190)+'px');e.style.fontSize=(17+rnd(19))+'px';document.body.append(e);setTimeout(()=>e.remove(),1200)}for(let i=0;i<(combo>=10?18:combo>=5?12:7);i++){let ray=document.createElement('span');ray.className='spark ray';let angle=(i/(combo>=10?18:combo>=5?12:7))*Math.PI*2;ray.style.left=cx+'px';ray.style.top=cy+'px';ray.style.setProperty('--x',Math.cos(angle)*(105+rnd(150))+'px');ray.style.setProperty('--y',Math.sin(angle)*(105+rnd(150))+'px');ray.style.setProperty('--rot',(rnd(180)-90)+'deg');document.body.append(ray);setTimeout(()=>ray.remove(),900)}let flash=document.createElement('div');flash.className='boost';document.body.append(flash);setTimeout(()=>flash.remove(),500);$('qcard').classList.add('celebrate');setTimeout(()=>$('qcard').classList.remove('celebrate'),410)}
function check(){if(!typed)return;let n=Number(typed);if(n!==problems[index].ans){miss++;combo=0;typed='';$('typed').textContent='_';document.body.classList.remove('charged','hyper');$('boostFill').style.width='0%';$('combo').textContent='';$('feedback').textContent='もういっかい！ 💪';$('feedback').style.color='#e27688';if(sfxOn)tone(220,.13,.05,'triangle');return}locked=true;combo++;maxCombo=Math.max(maxCombo,combo);$('typed').textContent='✓ '+n;$('feedback').style.color='#2ab18b';ping();sparkle();$('feedback').textContent=combo>=20?'👑 レジェンド ブースト！！':combo>=10?'🚀 ウルトラ ブースト！！':combo>=5?'⚡ ブースト かそくちゅう！':'✨ せいかい！';setTimeout(()=>{index++;if(index>=count)finish();else render()},400)}
$('start').onclick=()=>{ensureAudio();problems=Array.from({length:count},make);index=0;combo=0;maxCombo=0;miss=0;$('setup').classList.add('hidden');$('done').classList.add('hidden');$('play').classList.remove('hidden');started=performance.now();clearInterval(timer);timer=setInterval(()=>$('clock').textContent='⏱ '+fmt(performance.now()-started),150);$('clock').textContent='⏱ 0:00';render();startMusic()};
function finish(){let ms=performance.now()-started;clearInterval(timer);stopMusic();$('play').classList.add('hidden');$('done').classList.remove('hidden');$('result').textContent=fmt(ms);$('detail').textContent=count+'もん クリア！ · さいこう '+maxCombo+'コンボ · まちがい '+miss+'かい';$('best').textContent='';try{let key='flash100-best-'+mode+'-'+count,old=localStorage.getItem(key);if(!old||ms<+old){localStorage.setItem(key,ms);$('best').textContent='🎉 じこベスト こうしん！'}else $('best').textContent='🏅 ベストタイム '+fmt(+old)}catch(e){}}
$('again').onclick=()=>{$('done').classList.add('hidden');$('setup').classList.remove('hidden')};$('back').onclick=()=>location.href='/';
document.addEventListener('keydown',e=>{if($('play').classList.contains('hidden'))return;if(e.key>='0'&&e.key<='9'&&e.key.length===1){e.preventDefault();input(Number(e.key))}else if(e.key==='Backspace'){e.preventDefault();input('⌫')}else if(e.key==='Enter'){e.preventDefault();input('OK')}});
</script></body></html>
