<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>てにをは あそび | べんきょうあそび</title>
<style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#283246;background:#fff9ed}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:20px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#52637b;text-decoration:none;font-weight:700}.pill{background:#fff;border-radius:100px;padding:9px 14px;color:#7a5b3b;font-weight:800}.panel{background:#fff;border:3px solid #f6d8a3;border-radius:28px;padding:24px 18px;box-shadow:0 8px 0 #f6e5c6;margin-top:20px;text-align:center}h1{font-size:clamp(26px,7vw,38px);margin:12px 0 5px}.sub{color:#6d7180;margin:0 0 18px}.progress{display:flex;gap:7px;margin:18px 0 25px}.dot{height:10px;border-radius:10px;background:#eee9df;flex:1}.dot.done{background:#58bb91}.dot.current{background:#ffb65b}.count{font-weight:800;color:#8c6b47}.sentence{font-size:clamp(26px,6.8vw,40px);font-weight:800;line-height:1.9;margin:18px 0 22px;overflow-wrap:anywhere}.blank{display:inline-block;min-width:2.1em;border-bottom:5px solid #ffb65b;color:#d36b2b;line-height:1.3}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{font:inherit;cursor:pointer;touch-action:manipulation}.choice{border:3px solid #d6e6fc;background:#f1f7ff;border-radius:20px;min-height:92px;font-size:38px;font-weight:900;color:#315a8e}.choice:focus-visible,.next:focus-visible{outline:4px solid #ffb65b;outline-offset:3px}.choice:disabled{opacity:.65;cursor:default}.choice.correct{background:#d6f8df;border-color:#3ca56b;color:#186a3c;opacity:1}.choice.wrong{background:#ffe6e3;border-color:#e59a8f;color:#a04e46;opacity:1}.feedback{min-height:75px;padding:14px 5px 2px;font-size:21px;font-weight:800}.feedback small{display:block;font-size:16px;font-weight:600;color:#5e6573;margin-top:5px}.explain{margin-top:12px;padding:15px;text-align:left;background:#f0f9ef;border:2px solid #b9e5c5;border-radius:16px;font-size:17px;line-height:1.8;font-weight:600}.explain strong{color:#246b43}.explain[hidden]{display:none}.next{border:0;border-radius:18px;background:#ffab44;color:#3c2b1a;padding:17px 25px;font-size:22px;font-weight:900;width:100%;box-shadow:0 5px 0 #d98a31}.next:active{transform:translateY(3px);box-shadow:0 2px 0 #d98a31}.next[hidden],.screen[hidden]{display:none}.emoji{font-size:54px}.foot{font-size:13px;color:#7a7a7a;text-align:center;margin-top:22px}@media(max-width:380px){.panel{padding:18px 12px}.choice{min-height:75px;font-size:32px}}
</style>
</head>
<body><main>
<div class="top"><a href="../../index.html">← べんきょうあそび</a><span class="pill">🌼 こくご</span></div>
<section class="panel screen" id="play">
<div class="emoji" aria-hidden="true">🐣</div><h1>てにをは あそび</h1><p class="sub">ぴったりの ことばを えらぼう！</p>
<div class="progress" id="progress" aria-label="しんちょく"></div><div class="count" id="count"></div>
<div class="sentence" id="sentence"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="explain" id="explain" hidden aria-live="polite"></div>
<button class="next" id="next" hidden>つぎの もんだい →</button>
</section>
<section class="panel screen" id="finish" hidden><div class="emoji">🎉</div><h1>やったね！</h1><p class="sentence" id="result"></p><p class="sub">また あそぼうね！</p><button class="next" id="restart">もういっかい あそぶ</button></section>
<p class="foot">こたえは「は」「が」「を」「に」「で」「と」「へ」「の」から えらぶよ。<br>「は」は「わ」、「へ」は「え」と よむことが あるよ。</p>
</main>
<script>
'use strict';
// すべての文で、対象の助詞が自然に一意に決まるように文脈を指定。
const bank=[
 {before:'わたし',after:' いちねんせいです。',answer:'は',opts:['は','を','に'],why:'「わたしは」で、わたしの ことを つたえるよ。'},
 {before:'ぼく',after:' ななさいです。',answer:'は',opts:['が','は','を'],why:'「ぼくは」で、ぼくの ことを つたえるよ。'},
 {before:'きょう',after:' にちようびです。',answer:'は',opts:['を','に','は'],why:'「きょうは」で、きょうの ことを つたえるよ。'},
 {before:'りんご',after:' たべます。',answer:'を',opts:['を','は','に'],why:'なにを たべる？ 「りんごを」だね。'},
 {before:'ほん',after:' よみます。',answer:'を',opts:['に','を','で'],why:'なにを よむ？ 「ほんを」だね。'},
 {before:'てがみ',after:' かきます。',answer:'を',opts:['が','へ','を'],why:'なにを かく？ 「てがみを」だね。'},
 {before:'みず',after:' のみます。',answer:'を',opts:['に','を','と'],why:'なにを のむ？ 「みずを」だね。'},
 {before:'ねこ',after:' ねています。',answer:'が',opts:['が','を','に'],why:'だれが ねている？ 「ねこが」だね。'},
 {before:'あめ',after:' ふっています。',answer:'が',opts:['を','が','で'],why:'なにが ふっている？ 「あめが」だね。'},
 {before:'とり',after:' とんでいます。',answer:'が',opts:['に','を','が'],why:'なにが とんでいる？ 「とりが」だね。'},
 {before:'つくえの うえ',after:' ほんが あります。',answer:'に',opts:['に','を','と'],why:'どこに ある？ 「うえに」だね。'},
 {before:'はこ',after:' おもちゃを いれます。',answer:'に',opts:['で','に','が'],why:'どこに いれる？ 「はこに」だね。'},
 {before:'あさ しちじ',after:' おきます。',answer:'に',opts:['を','で','に'],why:'なんじに おきる？ 「しちじに」だね。'},
 {before:'えんぴつ',after:' じを かきます。',answer:'で',opts:['で','に','を'],why:'なにを つかって かく？ 「えんぴつで」だね。'},
 {before:'こうえん',after:' あそびます。',answer:'で',opts:['に','で','を'],why:'どこで あそぶ？ 「こうえんで」だね。'},
 {before:'はさみ',after:' かみを きります。',answer:'で',opts:['を','が','で'],why:'なにを つかって きる？ 「はさみで」だね。'},
 {before:'ともだち',after:' いっしょに あそびます。',answer:'と',opts:['と','を','で'],why:'だれと あそぶ？ 「ともだちと」だね。'},
 {before:'おかあさん',after:' いっしょに あるきます。',answer:'と',opts:['に','と','を'],why:'だれと あるく？ 「おかあさんと」だね。'},
 {before:'あか',after:' あおを まぜます。',answer:'と',opts:['で','に','と'],why:'「あかと あお」で、ふたつを つなぐよ。'},
 {before:'がっこう',after:' むかって あるきます。',answer:'へ',opts:['を','へ','が'],why:'どちらへ むかう？ 「がっこうへ」だね。'},
 {before:'おばあちゃんの いえ',after:' むかいます。',answer:'へ',opts:['へ','で','を'],why:'どちらへ むかう？ 「いえへ」だね。'},
 {before:'わたし',after:' くつです。',answer:'の',opts:['に','の','を'],why:'だれの くつ？ 「わたしの」だね。'},
 {before:'いぬ',after:' しっぽは ながいです。',answer:'の',opts:['の','を','で'],why:'だれの しっぽ？ 「いぬの」だね。'},
 {before:'あおい いろ',after:' かばんです。',answer:'の',opts:['が','に','の'],why:'「あおい いろの かばん」だね。'}
];
const guides={
 'は':{rule:'「は」は、だれや なにの おはなしかを しらせる ことばだよ。',tip:'この「は」は「わ」と よむよ。'},
 'が':{rule:'「が」は、だれが・なにが そうするのかを しらせる ことばだよ。',tip:'「だれが？」「なにが？」と きいてみよう。'},
 'を':{rule:'「を」は、なにを するのかの「なに」を しらせる ことばだよ。',tip:'「なにを たべる？」「なにを よむ？」と きいてみよう。'},
 'に':{rule:'「に」は、ばしょや じかん、いれる さきなどを しらせる ことばだよ。',tip:'「どこに？」「なんじに？」と きいてみよう。'},
 'で':{rule:'「で」は、なにを つかうか、どこで するかを しらせる ことばだよ。',tip:'「なにで？」「どこで？」と きいてみよう。'},
 'と':{rule:'「と」は、いっしょに する あいてや、ふたつの ものを つなぐ ことばだよ。',tip:'「だれと？」「なにと なに？」と きいてみよう。'},
 'へ':{rule:'「へ」は、すすむ ほうこうを しらせる ことばだよ。',tip:'この「へ」は「え」と よむよ。'},
 'の':{rule:'「の」は、だれの ものか、どんな ものかを つなげて しらせる ことばだよ。',tip:'「だれの？」「どんな？」と きいてみよう。'}
};
const hints={'は':'「だれの おはなし？」「なんの おはなし？」を かんがえよう。','が':'「だれが？」「なにが？」と きいてみよう。','を':'「なにを？」と きいてみよう。','に':'「どこに？」「なんじに？」と きいてみよう。','で':'「どこで？」「なにを つかって？」と きいてみよう。','と':'「だれと？」「なにと なに？」と きいてみよう。','へ':'「どちらへ むかう？」を かんがえよう。','の':'「だれの？」「どんな？」と きいてみよう。'};
let questions=[],index=0,correct=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function start(){questions=shuffle(bank).slice(0,5);index=0;correct=0;$('play').hidden=false;$('finish').hidden=true;render();}
function render(){answered=false;const q=questions[index];$('count').textContent=`${index+1} / 5 もんめ`;$('progress').replaceChildren(...Array.from({length:5},(_,i)=>{const d=document.createElement('div');d.className='dot'+(i<index?' done':i===index?' current':'');return d;}));$('sentence').replaceChildren(document.createTextNode(q.before),Object.assign(document.createElement('span'),{className:'blank',textContent:'？'}),document.createTextNode(q.after));$('choices').replaceChildren(...shuffle(q.opts).map(opt=>{const b=document.createElement('button');b.className='choice';b.textContent=opt;b.setAttribute('aria-label',opt);b.addEventListener('click',()=>choose(opt,b));return b;}));$('feedback').textContent='';$('explain').hidden=true;$('explain').textContent='';$('next').hidden=true;}
function choose(opt,button){if(answered)return;const q=questions[index];if(opt!==q.answer){button.classList.add('wrong');$('feedback').replaceChildren(document.createTextNode('おしい！ もういちど 😊'),Object.assign(document.createElement('small'),{textContent:hints[q.answer]}));return;}answered=true;correct++;button.classList.add('correct');for(const b of $('choices').children)b.disabled=true;$('sentence').querySelector('.blank').textContent=q.answer;$('feedback').replaceChildren(document.createTextNode('せいかい！ 🌟'),Object.assign(document.createElement('small'),{textContent:q.why}));const g=guides[q.answer];$('explain').hidden=false;$('explain').replaceChildren();const lead=document.createElement('strong');lead.textContent='どうして「'+q.answer+'」なの？';$('explain').append(lead,document.createElement('br'),document.createTextNode(q.why),document.createElement('br'),document.createTextNode(g.rule),document.createElement('br'),document.createTextNode('💡 '+g.tip),document.createElement('br'),document.createTextNode('🔊 「'+q.before+q.answer+q.after.trim()+'」と よんでみよう！'));$('next').hidden=false;$('next').textContent=index===4?'けっかを みる →':'つぎの もんだい →';}
$('next').addEventListener('click',()=>{index++;if(index===5){$('play').hidden=true;$('finish').hidden=false;$('result').textContent=`5もん ぜんぶ クリア！ ⭐⭐⭐⭐⭐`;}else render();});$('restart').addEventListener('click',start);start();
</script>
</body></html>
