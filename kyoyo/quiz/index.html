<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ものしりクイズ</title><style>

</style></head><body><main><section class="panel"><div class="top"><h1>🌟 ものしりクイズ</h1><span id="progress" class="muted"></span></div><div class="muted">あおい ことばを おすと、「ことばの いみ」が わかるよ。</div><div id="illustration" class="illustration" aria-hidden="true"></div><div id="question" class="question"></div><div id="dictionary" class="dictionary" hidden></div><div id="choices" class="choices"></div><div id="explain" class="explain" hidden></div><button id="next" class="next" hidden>つぎの もんだい →</button><div class="footer">5もんで おしまい。なんどでも あそべるよ！</div></section></main><script>
const words={

'きたはんきゅう':'ちきゅうを まんなかで わけたときの、きたがわの はんぶんだよ。',

'はつめい':'それまで なかった どうぐや しくみを、あたらしく つくりだすことだよ。',
'みんしゅしゅぎ':'みんなの いけんを たいせつにして、しゃかいの ことを きめていく かんがえかただよ。',

const bank=[

{cat:'いきもの',q:'イルカは なんの なかま？',a:['さかな','とり','ほにゅうるい'],ok:2,why:'イルカは ほにゅうるいだよ。あかちゃんを うんで、おちちで そだてるんだ。'},
{cat:'いきもの',q:'チョウの あかちゃんは なに？',a:['おたまじゃくし','いもむし','こざかな'],ok:1,why:'チョウは たまごから うまれて、ようちゅう（いもむし）、さなぎ、せいちゅうに なるよ。'},
{cat:'いきもの',q:'{しょくぶつ}が そだつために ひつような ものは？',a:['ひかり','おかし','プラスチック'],ok:0,why:'おおくの しょくぶつは、たいようの ひかりを つかって えいようを つくるよ。みずも たいせつだね。'},
{cat:'くらしと しゃかい',q:'かじを みつけたとき、にほんで かける でんわばんごうは？',a:['110','119','117'],ok:1,why:'119は しょうぼうしゃや きゅうきゅうしゃを よぶ ばんごうだよ。あぶないときは まず おとなに しらせよう。'},
{cat:'くらしと しゃかい',q:'{こっかい}では なにを はなしあう？',a:['くにの きまり','あしたの きゅうしょく','おうちの ばんごはん'],ok:0,why:'こっかいでは、ほうりつや くにの おかねの つかいかたなどを はなしあうよ。'},
{cat:'くらしと しゃかい',q:'しんごうが あかの とき、どうする？',a:['とまる','はしって わたる','ゆっくり わたる'],ok:0,why:'あかは とまれ の あいずだよ。あおでも くるまが こないか たしかめてから わたろう。'},
{cat:'ぶんかと れきし',q:'にほんで おしょうがつに たべる ことが おおい りょうりは？',a:['おせち','ピザ','カレー'],ok:0,why:'おせちは おしょうがつの とくべつな りょうりだよ。ひとつひとつの たべものに ねがいが こめられているんだ。'},
{cat:'ぶんかと れきし',q:'むかし、でんわが ないころ、はなれた ひとに しらせを とどける ほうほうは？',a:['てがみ','テレビでんわ','メール'],ok:0,why:'むかしから てがみで きもちや しらせを とどけていたよ。ひとが はこんだり、ゆうびんで とどけたりしたんだ。'},
{cat:'ぶんかと れきし',q:'たなばたは なんがつ なのか？',a:['3がつ 3にち','7がつ 7にち','12がつ 25にち'],ok:1,why:'たなばたは 7がつ 7にち。たんざくに ねがいごとを かく ふうしゅうが あるよ。ちいきによって 8がつに おいわいすることも あるんだ。'},
{cat:'にほんと せかい',q:'にほんが あるのは どの たいりくの ちかく？',a:['アジア','アフリカ','ヨーロッパ'],ok:0,why:'にほんは アジアの ひがしがわに ある しまぐにだよ。'},
{cat:'しぜんと かがく',q:'たいようが しずむのは どの {ほうい}？',a:['ひがし','にし','きた'],ok:1,why:'たいようは だいたい ひがしから のぼり、にしに しずむよ。'},
{cat:'いきもの',q:'カエルの あかちゃんは なに？',a:['おたまじゃくし','いもむし','ひよこ'],ok:0,why:'カエルは おたまじゃくしから そだつよ。あしが はえて、しっぽが みじかくなっていくんだ。'},
{cat:'くらしと しゃかい',q:'{じしん}で おおきく ゆれたら まず どうする？',a:['あたまを まもる','まどに ちかづく','たかい ところに のぼる'],ok:0,why:'まず あたまを まもろう。ものが おちたり たおれたり するから、あんぜんな ばしょで みを まもるんだ。'},
{cat:'ぶんかと れきし',q:'にほんの むかしからの ふくは？',a:['きもの','スーツ','ジーンズ'],ok:0,why:'きものは にほんで むかしから きられてきた ふくだよ。いまも おまつりや おいわいで きることが あるね。'}
];

const illustrations=['globe','water','flag','moon','water','rain','dolphin','butterfly','plant','fire','building','signal','food','letter','star','globe','compass','frog','safety','kimono'];
bank.forEach((q,i)=>q.art=illustrations[i]);
function drawArt(kind){$('illustration').innerHTML=`<svg viewBox="0 0 210 130" role="img" aria-label="もんだいの イラスト">${art[kind]||art.star}</svg>`}
let deck=[],index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){deck=shuffle(bank).slice(0,5);index=0;score=0;render()}
function render(){answered=false;$('dictionary').hidden=true;$('explain').hidden=true;$('next').hidden=true;const item=deck[index];drawArt(item.art);$('progress').textContent=`${index+1} / 5 もん ・ ${item.cat}`;$('question').replaceChildren();let last=0;const re=/\{([^}]+)\}/g;for(const m of item.q.matchAll(re)){ $('question').append(document.createTextNode(item.q.slice(last,m.index)));const b=document.createElement('button');b.className='term';b.textContent=m[1];b.onclick=()=>showWord(m[1]);$('question').append(b);last=m.index+m[0].length}$('question').append(document.createTextNode(item.q.slice(last)));$('choices').replaceChildren();item.a.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${i+1}　${a}`;b.onclick=()=>answer(i);$('choices').append(b)})}
function showWord(w){const d=$('dictionary');d.hidden=false;d.replaceChildren();const h=document.createElement('h2');h.textContent=`📖 ことばの いみ：「${w}」`;const p=document.createElement('div');p.textContent=words[w]||'この ことばは、あとで いっしょに しらべてみよう。';d.append(h,p)}
function answer(i){if(answered)return;answered=true;const q=deck[index];if(i===q.ok)score++;[...$('choices').children].forEach((b,n)=>{b.disabled=true;if(n===q.ok)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});$('explain').hidden=false;$('explain').textContent=(i===q.ok?'🎉 せいかい！　':'💡 おぼえよう！　')+q.why;$('next').hidden=false;$('next').textContent=index===4?'けっかを みる →':'つぎの もんだい →'}
$('next').onclick=()=>{if(index<4){index++;render()}else{ $('progress').textContent='おしまい！';$('illustration').innerHTML='<span style="font-size:72px">🏆</span>';$('question').textContent=`🎉 ${score} / 5 もん せいかい！`;$('choices').replaceChildren();$('dictionary').hidden=true;$('explain').hidden=false;$('explain').textContent='よく がんばったね！ まちがえた もんだいも、あたらしい ことを しった しょうこだよ。';$('next').textContent='もういちど あそぶ ↻';$('next').onclick=()=>{ $('next').onclick=nextDefault;start()}}};const nextDefault=$('next').onclick;start();
</script></body></html>
